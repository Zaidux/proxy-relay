[project]
name = "riciplay-relay"
version = "0.2.0"
description = "Lightweight peer-to-peer IP relay — share your residential IP to bypass geo-blocks and IP-based blocking"
readme = "README.md"
license = "MIT"
license-files = []
requires-python = ">=3.8"
authors = [{name = "Zaidux", email = "zaiduabubakar777@gmail.com"}]
keywords = ["proxy", "relay", "vpn", "ip", "residential", "bypass", "cloudflare"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Go",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Zaidux/proxy-relay"
Repository = "https://github.com/Zaidux/proxy-relay"

[project.scripts]
"proxy-relay" = "riciplay_relay:main"
